<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>富士ストライク</title><style>*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{width:100%;height:100%;background:#050208;font-family:serif;color:#fff;overflow:hidden}canvas{display:block;width:100%;height:auto}#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;font-size:12px;font-weight:bold;pointer-events:none;z-index:5}#stats,#coins{background:rgba(0,0,0,.75);border:2px solid #d4a017;border-radius:10px;padding:4px 8px;color:#ffe0f0}.btn{background:linear-gradient(#d4a017,#a06010);color:#fff;border:2px solid #ffd966;border-radius:22px;padding:12px 24px;font-size:15px;font-family:inherit;font-weight:bold;box-shadow:0 4px 0 #604010;margin:6px}#btns{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;z-index:7}.tb{width:60px;height:60px;border-radius:50%;background:rgba(212,160,23,.8);border:3px solid #ffd966;font-size:22px;font-weight:bold;display:flex;align-items:center;justify-content:center;color:#fff}.tb:active{transform:scale(.9)}#start{position:absolute;inset:0;background:rgba(5,2,10,.97);display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:10;text-align:center;padding:20px}h1{color:#d4a017;text-shadow:0 0 20px #d4a017;font-size:26px;margin-bottom:10px}p{font-size:13px;color:#ffe0f0;margin-bottom:16px;line-height:1.6}#toast{position:absolute;top:60px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.95);border:2px solid #d4a017;border-radius:12px;padding:8px 16px;font-size:12px;font-weight:bold;color:#ffd966;z-index:20;opacity:0;transition:.3s;pointer-events:none}#toast.show{opacity:1}</style></head><body><canvas id="c" width="500" height="600"></canvas><div id="hud"><div id="stats">❤ <span id="hp">100</span> ⚔ <span id="kills">0</span></div><div id="coins">🪙 <span id="coin">0</span></div></div><div id="btns"><div class="tb" id="bl">◀</div><div class="tb" id="br">▶</div><div style="display:flex;gap:10px"><div class="tb" id="ba">⚔</div></div></div><div id="start"><h1>富士ストライク</h1><p>曜日の鬼を倒せ！<br>左右で移動、⚔で攻撃</p><button class="btn" onclick="startGame()">▶ 開始</button></div><div id="toast"></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),W=500,H=600,GY=520;let hp=100,kills=0,coins=0,enemies=[],parts=[],spawnT=30,keys={},playing=false,t=0,facing=1;const px={x:200,vx:0};function startGame(){document.getElementById('start').style.display='none';playing=true;reset();}function reset(){hp=100;kills=0;enemies=[];spawnT=30;px.x=200;upd();}function upd(){document.getElementById('hp').textContent=Math.max(0,Math.round(hp));document.getElementById('kills').textContent=kills;document.getElementById('coin').textContent=coins;}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500);}function spawn(){const s=Math.random()<.5?-1:1;enemies.push({x:s===1?W+20:-50,y:GY-60,w:44,h:60,hp:30+kills*3,mhp:30+kills*3,vx:s*-1.2,dmg:8,at:0,hf:0,bp:Math.random()*6});}function hit(){const near=enemies.find(e=>!e.dead&&Math.abs(e.x+22-(px.x+25))<90);if(!near)return;near.hp-=25+Math.random()*10;near.hf=8;for(let i=0;i<8;i++)parts.push({x:near.x+22,y:GY-30,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8-2,life:30,c:'#ff6ba6'});if(near.hp<=0){near.dead=true;kills++;coins+=10;upd();toast('倒した！');}}function draw(){t++;x.fillStyle='#1a0a2e';x.fillRect(0,0,W,H);const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a0a2e');g.addColorStop(.6,'#3a1a5e');g.addColorStop(1,'#6a2a5e');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#fff';x.beginPath();x.arc(400,80,35,0,7);x.fill();x.fillStyle='#1a0a2e';x.beginPath();x.arc(388,70,32,0,7);x.fill();const m=x.createLinearGradient(0,100,0,GY);m.addColorStop(0,'#9a7ac0');m.addColorStop(1,'#2a1a4+fe');x.fillStyle=m;x.beginPath();acingx.moveTo(0,GY);x.lineTo,(W/2-80by,140);x.lineTo(W/2,100+);x.lineTo(W/2+80,140);26x.lineTo(W,GY);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(W/2-60,160);x.lineTo(W/2,100);x.lineTo(W/2+60,160);x.lineTo(W/2+40,180);x.quadraticCurveTo(W/2,160,W/2-40,180);x.fill();x.fillStyle='#1a0a2a';x.fillRect(0,GY,W,H-GY);x.fillStyle='#3a2a5a';x.fillRect(0,GY,W,4);const bob=Math.sin(t*.1)*2,cx=px.x+25,by=GY-75+bob;x.fillStyle='rgba(0,0,0,.4)';x.beginPath();x.ellipse(cx,GY+5,26,7,0,0,7);x.fill();x.fillStyle='#2c4a80';x.beginPath();x.moveTo(cx-18,by+50);x.lineTo(cx+18,by+50);x.lineTo(cx+22,by+72);x.lineTo(cx-22,by+72);x.fill();x.fillStyle='#d4a017';x.fillRect(cx-20,by+58,40,6);x.fillStyle='#ffdcc0';x.beginPath();x.arc(cx,by+22,24,0,7);x.fill();x.fillStyle='#0a0a1a';x.beginPath();x.arc(cx,by+18,24,Math.PI,0);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(cx-9,by+26,6,0,7);x.arc(cx+9,by+26,6,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(cx-9,3,0,7);x.arc(cx+9+facing,by+26,3,0,7);x.fill();enemies.forEach(e=>{if(e.dead)return;const eb=Math.sin(t*.12+e.bp)*4,ec=e.x+22,ey=GY-30+eb;x.fillStyle='rgba(0,0,0,.4)';x.beginPath();x.ellipse(ec,GY+5,22,6,0,0,7);x.fill();x.fillStyle=e.hf>0?'#fff':'#c0392b';x.beginPath();x.arc(ec,ey,26,0,7);x.fill();x.fillStyle=e.hf>0?'#fff':'#e67e22';x.beginPath();x.ellipse(ec,ey+10,18,10,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.moveTo(ec-12,ey-18);x.lineTo(ec-18,ey-32);x.lineTo(ec-5,ey-20);x.fill();x.beginPath();x.moveTo(ec+12,ey-18);x.lineTo(ec+18,ey-32);x.lineTo(ec+5,ey-20);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(ec-8,ey-4,6,0,7);x.arc(ec+8,ey-4,6,0,7);x.fill();x.fillStyle='#000';x.beginPath();x.arc(ec-8,ey-4,3.5,0,7);x.arc(ec+8,ey-4,3.5,0,7);x.fill();x.fillStyle='#000';x.fillRect(ec-20,ey-45,40,5);x.fillStyle='#ff4a4a';x.fillRect(ec-20,ey-45,40*(e.hp/e.mhp),5);});parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.life--;x.globalAlpha=p.life/30;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill();});x.globalAlpha=1;}function loop(){if(playing){if(keys.l){px.x-=5;facing=-1}if(keys.r){px.x+=5;facing=1}px.x=Math.max(0,Math.min(W-50,px.x));if(--spawnT<=0&&kills<10){spawn();spawnT=70;}enemies.forEach(e=>{if(e.dead)return;e.x+=e.vx;if(e.hf>0)e.hf--;if(Math.abs(e.x+22-(px.x+25))<50&&e.at<=0){e.at=60;hp-=e.dmg;upd();if(hp<=0){hp=0;playing=false;toast('敗北…');}}if(e.at>0)e.at--;});enemies=enemies.filter(e=>!e.dead&&e.x>-100&&e.x<W+100);parts=parts.filter(p=>p.life>0);if(kills>=10){playing=false;toast('🌸 勝利！🌸');}}draw();requestAnimationFrame(loop);}document.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space')hit();});document.addEventListener('keyup',e=>keys[e.code]=false);function bind(id,k){const el=document.getElementById(id);['touchstart','mousedown'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[k]=true}));['touchend','mouseup','mouseleave'].forEach(ev=>el.addEventListener(ev,e=>{e.preventDefault();keys[k]=false}))}bind('bl','l');bind('br','r');document.getElementById('ba').addEventListener('touchstart',e=>{e.preventDefault();hit()});document.getElementById('ba').addEventListener('mousedown',e=>{e.preventDefault();hit()});loop();</script></body></html>
